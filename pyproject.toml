[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-triage"
version = "0.1.0"
description = "Normalize Trivy and Semgrep reports, render Markdown, file GitLab issues"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools]
packages = ["triage"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
