name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --sarif --output semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH,MEDIUM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-json
          path: trivy.json

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  triage:
    needs: [semgrep, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build report and fail on HIGH
        run: |
          python -m triage reports/trivy-json/trivy.json \
            reports/semgrep-sarif/semgrep.sarif \
            -o security-report.md \
            --fail-on HIGH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: security-report.md
